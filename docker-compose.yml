services:
  postgres:
    image: postgres:16-alpine
    container_name: manuscript-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: manuscript
      POSTGRES_PASSWORD: manuscript
      POSTGRES_DB: manuscript
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manuscript -d manuscript"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
