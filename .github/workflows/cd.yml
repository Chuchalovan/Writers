name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manuscript_test?schema=public
  BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
  BETTER_AUTH_URL: http://localhost:3000
  ENCRYPTION_SECRET: ci-encryption-key-32chars-minimum
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy placeholder
        run: |
          echo "Build artifact ready for deployment."
          echo "Connect your hosting provider (Vercel, Railway, etc.) to enable auto-deploy."
          echo "For Vercel: add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets."

      # Uncomment when Vercel is configured:
